name: Canary CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: canary-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canary-tests:
    name: canary-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record the checked-out revision
        run: git rev-parse HEAD
      - name: Verify the canary application
        run: python3 -B -m unittest discover -s tests -v
