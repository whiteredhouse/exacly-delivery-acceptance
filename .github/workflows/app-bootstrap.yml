name: Trusted App bootstrap
run-name: canary-bootstrap:${{ inputs.mode }}:pr-${{ inputs.mode == 'verify' && inputs.pr_number || '0' }}

# Main role environments and the separate owner-reviewed diagnostic environment
# require their exact branch policies before storing keys. All runs are manual.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed canary PR preparation, App preflight or exact generated-merge verification
        type: choice
        options: [preflight, verify, diagnose-merger, app-grant-preflight, create-canary]
        default: preflight
        required: true
      pr_number:
        description: Positive decimal PR number; required only for verify
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: canary-app-bootstrap-${{ inputs.mode }}-${{ inputs.pr_number || 'preflight' }}
  cancel-in-progress: false

jobs:
  create-canary:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/native-merge-trial' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205'
          && inputs.mode == 'create-canary' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out the reviewed fixed canary author
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create or discover the one fixed data-only canary PR
        id: author
        env:
          CANARY_AUTHOR_TOKEN: ${{ github.token }}
          CANARY_MODE: ${{ inputs.mode }}
          CANARY_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/create_canary_pr.py \
            --out "$RUNNER_TEMP/create-canary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain only the safe author result
        if: >-
          ${{ always() && (steps.author.outcome == 'success' || steps.author.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: create-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/create-canary-${{ github.run_id }}-${{ github.run_attempt }}/author-result.json
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error

  app-grant-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/preflight-diagnostics' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205'
          && inputs.mode == 'app-grant-preflight' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: canary-merger-diagnostic
      deployment: false
    steps:
      - name: Check out the owner-reviewed candidate packager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the reviewed native App-grant implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: whiteredhouse/exacly
          ref: 2331d84b1b29832b3c91f291a5daef765b4c0c7d
          path: exacly-runtime
          persist-credentials: false
      - name: Install the pinned native runtime tools before minting
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: exacly-runtime
          install_args: python uv
          persist_github_token: false
      - name: Install locked native dependencies before minting
        run: uv sync --locked --project exacly-runtime --python 3.12
      - name: Mint the existing one-repository merger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Check advisory mint metadata and actual server protection with native Exacly
        id: preflight
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            uv run --no-sync --project exacly-runtime python -I -B diagnostic/tools/app_grant_preflight.py \
            --core-source "$GITHUB_WORKSPACE/exacly-runtime" \
            --out "$RUNNER_TEMP/app-grant-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain only the three advisory metadata files
        if: >-
          ${{ always() && steps.app-token.outcome == 'success'
              && (steps.preflight.outcome == 'success' || steps.preflight.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/mint-attestation.json
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/actor-candidate.json
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error

  merger-diagnostic:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/preflight-diagnostics' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205'
          && inputs.mode == 'diagnose-merger' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: canary-merger-diagnostic
      deployment: false
    steps:
      - name: Check out the owner-reviewed diagnostic workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the original reviewed preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 723cb8f3a77d4208cb5840e750cca4b9c3c0c7c8
          path: trusted-source
          persist-credentials: false
      - name: Mint the existing one-repository merger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Diagnose the original read-only merger preflight
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B diagnostic/tools/hosted_merger_diagnostic.py \
            --trusted-source "$GITHUB_WORKSPACE/trusted-source" \
            --out "$RUNNER_TEMP/canary-merger-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  verifier-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && inputs.mode == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: canary-verifier
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint one-repository verifier token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572341'
          private-key: ${{ secrets.VERIFIER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-metadata: read
          skip-token-revoke: false
      - name: Authenticate verifier installation without provider writes
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/app_bootstrap.py preflight \
            --role verifier --installation-id "$CANARY_INSTALLATION_ID" \
            --out "$RUNNER_TEMP/canary-verifier-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  merger-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && inputs.mode == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: canary-merger
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint one-repository merger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Authenticate merger installation without merge or ref writes
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/app_bootstrap.py preflight \
            --role merger --installation-id "$CANARY_INSTALLATION_ID" \
            --out "$RUNNER_TEMP/canary-merger-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  verify-generated-merge:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && inputs.mode == 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    environment:
      name: canary-verifier
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the data-only PR selection before minting a token
        env:
          CANARY_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 -I -B - <<'PY'
          import os
          import re
          if re.fullmatch(r"[1-9][0-9]{0,9}", os.environ["CANARY_PR_NUMBER"]) is None:
              raise SystemExit("verify requires a positive decimal PR number without leading zeros")
          PY
      - name: Mint one-repository verifier token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572341'
          private-key: ${{ secrets.VERIFIER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-metadata: read
          skip-token-revoke: false
      - name: Verify exact generated merge and retain the genuine check result
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_ACTIONS_READ_TOKEN: ${{ github.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          CANARY_PR_NUMBER: ${{ inputs.pr_number }}
          CANARY_RUN_URL: https://github.com/whiteredhouse/exacly-delivery-acceptance/actions/runs/${{ github.run_id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/app_bootstrap.py verify \
            --pr-number "$CANARY_PR_NUMBER" --source-commit "$GITHUB_SHA" \
            --installation-id "$CANARY_INSTALLATION_ID" --run-url "$CANARY_RUN_URL" \
            --out "$RUNNER_TEMP/canary-verification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
