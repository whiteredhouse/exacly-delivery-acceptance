name: Trusted App bootstrap
run-name: canary-bootstrap:${{ inputs.mode }}:pr-${{ (inputs.mode == 'native-positive-trial' || inputs.mode == 'native-readiness-diagnostic') && '5' || (inputs.mode == 'verify' && inputs.pr_number || '0') }}

# Main role environments and the separate owner-reviewed diagnostic environment
# require their exact branch policies before storing keys. All runs are manual.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: App preflight, exact generated-merge verification or separately approved native trial
        type: choice
        options: [preflight, verify, diagnose-merger, app-grant-preflight, native-positive-trial, native-readiness-diagnostic]
        default: preflight
        required: true
      pr_number:
        description: Positive decimal PR number; required only for verify
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: canary-app-bootstrap-${{ inputs.mode }}-${{ inputs.pr_number || 'preflight' }}
  cancel-in-progress: false

jobs:
  native-readiness-diagnostic:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/preflight-diagnostics' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && github.actor_id == '1679024'
          && inputs.mode == 'native-readiness-diagnostic' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: canary-merger-diagnostic
      deployment: false
    steps:
      - name: Check out the owner-reviewed read-only diagnostic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the exact native diagnostic implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: whiteredhouse/exacly
          ref: 9ef4b0adc5f61310154544c636693123fd225737
          path: exacly-readiness-runtime
          persist-credentials: false
      - name: Install fixed tools before minting
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: exacly-readiness-runtime
          install_args: python uv
          persist_github_token: false
      - name: Install locked dependencies before minting
        run: uv sync --locked --project exacly-readiness-runtime --python 3.12
      - name: Mint the one-repository App token for read-only inspection
        id: diagnostic-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          permission-statuses: read
          skip-token-revoke: false
      - name: Inspect the fixed native readiness conditions once without effects
        id: diagnostic
        env:
          CANARY_APP_TOKEN: ${{ steps.diagnostic-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.diagnostic-token.outputs.installation-id }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 180s \
            uv run --no-sync --project exacly-readiness-runtime python -I -B diagnostic/tools/native_readiness_diagnostic.py \
            --core-source "$GITHUB_WORKSPACE/exacly-readiness-runtime" \
            --out "$RUNNER_TEMP/native-readiness-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain only the three advisory diagnostic files
        if: ${{ always() && steps.diagnostic-token.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-readiness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-readiness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/mint-attestation.json
            ${{ runner.temp }}/native-readiness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/actor-candidate.json
            ${{ runner.temp }}/native-readiness-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/native-readiness-diagnostic.json
          retention-days: 7
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error

  native-positive-trial:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/preflight-diagnostics' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205'
          && github.actor_id == '1679024'
          && inputs.mode == 'native-positive-trial' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
    environment:
      name: canary-merger-diagnostic
      deployment: false
    steps:
      - name: Check out the reviewed fixed trial coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the exact merged native runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: whiteredhouse/exacly
          ref: 9a5cd90b8d3c3b2acc2a00e7e68e175558025432
          path: exacly-runtime
          persist-credentials: false
      - name: Install the fixed runtime tools before minting
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: exacly-runtime
          install_args: python uv
          persist_github_token: false
      - name: Install tracing and locked dependencies before minting
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=15s 180s \
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=30 update
          sudo -n env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=15s 180s \
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=30 install --yes strace libseccomp2
          uv sync --locked --project exacly-runtime --python 3.12
      - name: Mint the selected token for this job only
        id: native-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          permission-statuses: read
          skip-token-revoke: false
      - name: Prepare actual storage and the proposed merge packet
        id: native-prepare
        env:
          CANARY_APP_TOKEN: ${{ steps.native-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.native-token.outputs.installation-id }}
          CANARY_RELAY_TOKEN: ${{ github.token }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            uv run --no-sync --project exacly-runtime python -I -B diagnostic/tools/native_positive_trial.py prepare \
            --core-source "$GITHUB_WORKSPACE/exacly-runtime" \
            --private "$RUNNER_TEMP/native-positive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Publish only the proposed merge packet and manual owner instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-positive-merge-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/merge-proposal.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/merge-approval-instructions.json
          retention-days: 7
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error
      - name: Await exact owner selection, invoke once and prove offline replay
        id: native-merge
        env:
          CANARY_APP_TOKEN: ${{ steps.native-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.native-token.outputs.installation-id }}
          CANARY_RELAY_TOKEN: ${{ github.token }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 1200s \
            uv run --no-sync --project exacly-runtime python -I -B diagnostic/tools/native_positive_trial.py merge \
            --core-source "$GITHUB_WORKSPACE/exacly-runtime" \
            --private "$RUNNER_TEMP/native-positive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Publish only the separately proposed observer packet and instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-positive-observer-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/observer-proposal.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/observer-approval-instructions.json
          retention-days: 7
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error
      - name: Await separate observer selection and run the authentic bound test once
        id: native-observe
        env:
          CANARY_APP_TOKEN: ${{ steps.native-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.native-token.outputs.installation-id }}
          CANARY_RELAY_TOKEN: ${{ github.token }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 900s \
            uv run --no-sync --project exacly-runtime python -I -B diagnostic/tools/native_positive_trial.py observe \
            --core-source "$GITHUB_WORKSPACE/exacly-runtime" \
            --private "$RUNNER_TEMP/native-positive-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain only safe trial results and actual owner selection receipts
        if: ${{ always() && steps.native-token.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-positive-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/merge-approval-receipt.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/observer-approval-receipt.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/merge-result.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/offline-replay.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/observer-result.json
            ${{ runner.temp }}/native-positive-${{ github.run_id }}-${{ github.run_attempt }}/trial-report.json
          retention-days: 7
          overwrite: false
          include-hidden-files: false
          if-no-files-found: warn

  app-grant-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/preflight-diagnostics' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205'
          && inputs.mode == 'app-grant-preflight' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: canary-merger-diagnostic
      deployment: false
    steps:
      - name: Check out the owner-reviewed candidate packager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the merged native required-condition implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: whiteredhouse/exacly
          ref: 9a5cd90b8d3c3b2acc2a00e7e68e175558025432
          path: exacly-runtime
          persist-credentials: false
      - name: Install the pinned native runtime tools before minting
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          working_directory: exacly-runtime
          install_args: python uv
          persist_github_token: false
      - name: Install locked native dependencies before minting
        run: uv sync --locked --project exacly-runtime --python 3.12
      - name: Mint the explicitly expanded one-repository merger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          permission-statuses: read
          skip-token-revoke: false
      - name: Check advisory grant, protection and required-condition endpoint access
        id: preflight
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            uv run --no-sync --project exacly-runtime python -I -B diagnostic/tools/app_grant_preflight.py \
            --core-source "$GITHUB_WORKSPACE/exacly-runtime" \
            --out "$RUNNER_TEMP/app-grant-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain only the four advisory metadata files
        if: >-
          ${{ always() && steps.app-token.outcome == 'success'
              && (steps.preflight.outcome == 'success' || steps.preflight.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/mint-attestation.json
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/actor-candidate.json
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
            ${{ runner.temp }}/app-grant-preflight-${{ github.run_id }}-${{ github.run_attempt }}/readiness-endpoint-facts.json
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error

  merger-diagnostic:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/codex/preflight-diagnostics' && github.run_attempt == 1
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205'
          && inputs.mode == 'diagnose-merger' && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: canary-merger-diagnostic
      deployment: false
    steps:
      - name: Check out the owner-reviewed diagnostic workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
      - name: Check out the original reviewed preflight source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 723cb8f3a77d4208cb5840e750cca4b9c3c0c7c8
          path: trusted-source
          persist-credentials: false
      - name: Mint the existing one-repository merger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Diagnose the original read-only merger preflight
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B diagnostic/tools/hosted_merger_diagnostic.py \
            --trusted-source "$GITHUB_WORKSPACE/trusted-source" \
            --out "$RUNNER_TEMP/canary-merger-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  verifier-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && inputs.mode == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: canary-verifier
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint one-repository verifier token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572341'
          private-key: ${{ secrets.VERIFIER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-metadata: read
          skip-token-revoke: false
      - name: Authenticate verifier installation without provider writes
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/app_bootstrap.py preflight \
            --role verifier --installation-id "$CANARY_INSTALLATION_ID" \
            --out "$RUNNER_TEMP/canary-verifier-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  merger-preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && inputs.mode == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: canary-merger
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint one-repository merger token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572362'
          private-key: ${{ secrets.MERGER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: write
          permission-pull-requests: read
          permission-checks: read
          permission-administration: read
          permission-metadata: read
          skip-token-revoke: false
      - name: Authenticate merger installation without merge or ref writes
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/app_bootstrap.py preflight \
            --role merger --installation-id "$CANARY_INSTALLATION_ID" \
            --out "$RUNNER_TEMP/canary-merger-preflight-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  verify-generated-merge:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
          && github.repository == 'whiteredhouse/exacly-delivery-acceptance'
          && github.repository_id == '1442278205' && inputs.mode == 'verify' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    environment:
      name: canary-verifier
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the data-only PR selection before minting a token
        env:
          CANARY_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 -I -B - <<'PY'
          import os
          import re
          if re.fullmatch(r"[1-9][0-9]{0,9}", os.environ["CANARY_PR_NUMBER"]) is None:
              raise SystemExit("verify requires a positive decimal PR number without leading zeros")
          PY
      - name: Mint one-repository verifier token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5572341'
          private-key: ${{ secrets.VERIFIER_PRIVATE_KEY }}
          owner: whiteredhouse
          repositories: exacly-delivery-acceptance
          github-api-url: https://api.github.com
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
          permission-metadata: read
          skip-token-revoke: false
      - name: Verify exact generated merge and retain the genuine check result
        env:
          CANARY_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_ACTIONS_READ_TOKEN: ${{ github.token }}
          CANARY_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          CANARY_PR_NUMBER: ${{ inputs.pr_number }}
          CANARY_RUN_URL: https://github.com/whiteredhouse/exacly-delivery-acceptance/actions/runs/${{ github.run_id }}
        run: |
          umask 077
          timeout --signal=TERM --kill-after=5s 120s \
            python3 -I -B tools/app_bootstrap.py verify \
            --pr-number "$CANARY_PR_NUMBER" --source-commit "$GITHUB_SHA" \
            --installation-id "$CANARY_INSTALLATION_ID" --run-url "$CANARY_RUN_URL" \
            --out "$RUNNER_TEMP/canary-verification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
